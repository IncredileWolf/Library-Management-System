
spring.application.name=Library-Management-System

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_management?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Library Configuration
user.valid.days=${USER_VALID_DAYS:14}
user.delayed.finePerDay=${USER_DELAYED_FINE_PER_DAY:1}

# Security Authorities
student.authority=${STUDENT_AUTHORITY:STUDENT}
admin.authority=${ADMIN_AUTHORITY:ADMIN}

# Redis Configuration
redis.user.details.timeout=${REDIS_USER_DETAILS_TIMEOUT:10}
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
